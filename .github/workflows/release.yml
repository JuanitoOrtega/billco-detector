name: Release automático

# Cada push a main: corre las pruebas y, si config.VERSION apunta a una
# versión cuyo tag aún no existe, crea el tag vX.Y.Z y el release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial y tags completos para detectar duplicados

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest -q

      - name: Leer versión de config.py
        id: version
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'VERSION\s*:\s*str\s*=\s*\"([^\"]+)\"', pathlib.Path('config/config.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION"

      - name: Crear tag y release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "El tag v$VERSION ya existe; no se crea un nuevo release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Billco Detector v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
